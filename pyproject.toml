[project]
name = "leakix"
version = "1.1.0"
description = "Official python client for LeakIX (https://leakix.net)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Danny Willems", email = "danny@leakix.net" },
    { name = "Valentin Lobstein", email = "valentin@leakix.net" },
]
requires-python = ">=3.11"
keywords = [
    "leakix",
    "security",
    "osint",
    "reconnaissance",
    "vulnerability",
    "attack-surface",
    "exposure",
    "threat-intelligence",
    "api-client",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "requests",
    "httpx>=0.28.0",
    "l9format==2.0.1",
    "fire>=0.5,<0.8",
]

[dependency-groups]
dev = [
    "python-decouple",
    "pytest",
    "pytest-cov",
    "mypy",
    "types-requests",
    "requests-mock",
    "ruff",
    "pip-audit",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Allow percent formatting in example/executable (existing code style)
"example/*.py" = ["UP031"]
"executable/*.py" = ["UP031"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.urls]
Homepage = "https://leakix.net"
Repository = "https://github.com/LeakIX/LeakIXClient-Python"
Issues = "https://github.com/LeakIX/LeakIXClient-Python/issues"
Changelog = "https://github.com/LeakIX/LeakIXClient-Python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["leakix/", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["leakix/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
