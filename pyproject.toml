[project]
name = "leakix"
version = "0.1.10"
description = "Official python client for LeakIX (https://leakix.net)"
authors = [{ name = "Danny Willems", email = "danny@leakix.net" }]
requires-python = ">=3.11"
dependencies = [
    "requests",
    "l9format==2.0.0",
    "fire>=0.5,<0.8",
]

[dependency-groups]
dev = [
    "python-decouple",
    "pytest",
    "pytest-cov",
    "mypy",
    "types-requests",
    "requests-mock",
    "ruff",
    "pip-audit",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Allow percent formatting in example/executable (existing code style)
"example/*.py" = ["UP031"]
"executable/*.py" = ["UP031"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
