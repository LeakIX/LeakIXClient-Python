name: CI
on: push

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GNU sed on macOS
        if: runner.os == 'macOS'
        run: brew install gnu-sed
      - name: Install deps
        run: make install
      - name: Run tests
        run: make test
      - name: Check formatting
        run: make check-format
      - name: Run linter
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Security audit
        run: make audit

  ci-windows:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: make install
      - name: Run tests
        run: make test
      - name: Check formatting
        run: make check-format
      - name: Run linter
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Security audit
        run: make audit
